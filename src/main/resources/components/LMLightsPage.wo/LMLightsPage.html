<!doctype html>
<html>
	<head>
		<title>Ljósin í borginni</title>
		<meta charset="utf-8">
		<style>
			body {
				background-color: black;
				text-align: center;
			}
			
			a {
				display: inline-block;
				color:white;
				text-decoration: none;
				font-size: 50px;
				border: 1px solid gray;
				padding: 20px;
				background-color: rgba( 50,50,50,0.6);
				border-radius: 10px;
				margin: 20px;
			}

			input[type=text] {
				margin: 2px;
				padding: 2px;
				width: 200px;
				border:none; 
				color: white;
				font-size: 80px;
				font-weight: bold;
				background-color: black;
				text-align: center;
			}
			
			textarea:focus, input:focus{
				outline: none;
				background-color: rgba( 50,50,50,0.9);
			}

			h3 {
				color: gray;
			}

			.error {
				color: orange;
				font-size: 30px;
			}
		</style>
		<wo:script namespace="ng" filename="ng-js.js" />
	</head>
	<body>
		<wo:if condition="$errorMessage">
			<p class="error"><wo:str value="$errorMessage" /></p>
		</wo:if>
		<wo:form action="$colorChanged">
			<wo:AjaxObserveField action="$colorChanged">
				<h3>Borði</h3>
				<p>
					<wo:LField value="$red" style="color: red" />
					<wo:LField value="$green" style="color: green" />
					<wo:LField value="$blue" style="color: blue" />
					<wo:LField value="$white" style="color: white" />
					<wo:LField value="$brightness" style="color: gray" />
				</p>
			</wo:AjaxObserveField>
		</wo:form>
		<wo:form action="$intervalChanged">
			<wo:AjaxObserveField action="$intervalChanged">
				<h3>Sekúndur milli eldinga (lágm. – hám.)</h3>
				<p>
					<wo:LField value="$minSeconds" style="color: yellow" />
					<wo:LField value="$maxSeconds" style="color: orange" />
				</p>
			</wo:AjaxObserveField>
		</wo:form>
		<wo:AjaxUpdateLink action="$strike">⚡</wo:AjaxUpdateLink>
		<wo:link action="$toggleStorm"><wo:str value="$stormLabel" /></wo:link>
	</body>
</html>
